<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corva Revamp v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b10; --surface:#111218; --surfaceHover:#16171f;
  --border:rgba(255,255,255,.06); --borderHover:rgba(255,255,255,.12);
  --text:#edeef2; --text2:rgba(255,255,255,.55); --text3:rgba(255,255,255,.35); --muted:rgba(255,255,255,.22); --label:rgba(255,255,255,.68);
  --accent:#8b5cf6; --accentLight:#a78bfa; --accentDim:rgba(139,92,246,.12); --accentBorder:rgba(139,92,246,.25);
  --green:#34d399; --greenDim:rgba(52,211,153,.10); --greenBorder:rgba(52,211,153,.22);
  --yellow:#fbbf24; --red:#f87171; --redDim:rgba(248,113,113,.08); --orange:#f97316; --cyan:#22d3ee;
  --hi:inset 0 1px 0 rgba(255,255,255,.04);
  --tileShadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -16px rgba(0,0,0,.7);
  --tileLift:0 2px 4px rgba(0,0,0,.5),0 26px 60px -22px rgba(0,0,0,.85);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050609;color:var(--text);font-family:"DM Sans",system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* review harness */
.harness{height:46px;display:flex;align-items:center;gap:18px;padding:0 16px;background:#0d0e13;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px}
.harness b{font-weight:600}
.hgroup{display:flex;align-items:center;gap:6px;color:var(--text3)}
.hseg{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:2px}
.hseg button{padding:5px 12px;border-radius:7px;color:var(--text2);font-weight:500}
.hseg button.on{background:rgba(255,255,255,.09);color:var(--text)}
.hnote{margin-left:auto;padding:6px 12px;border-radius:8px;background:var(--accentDim);color:var(--accentLight);border:1px solid var(--accentBorder);font-weight:600}
.stage{height:calc(100% - 46px);overflow:auto}
.notes{position:fixed;right:16px;top:58px;width:360px;background:#14151c;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:50;display:none;line-height:1.5}
.notes.on{display:block}
.notes h4{font-size:13px;margin-bottom:8px}
.notes ul{padding-left:16px;color:var(--text2);font-size:12.5px;display:grid;gap:6px}

/* app frame */
.app{width:100%;height:100%;background:var(--bg);display:grid;grid-template-rows:32px minmax(0,1fr) 66px;position:relative;overflow:hidden;container-type:inline-size;container-name:app}
.app.small{width:1280px;height:860px;margin:20px auto;border:1px solid rgba(255,255,255,.1);border-radius:8px}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 520px at 8% -12%,rgba(139,92,246,.12),transparent 62%),radial-gradient(700px 420px at 75% -18%,rgba(160,170,255,.05),transparent 60%)}
.titlebar{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--text2);position:relative;z-index:1}
.titlebar .win{margin-left:auto;display:flex;gap:18px;color:var(--text3)}
.logo{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 200deg,#3b82f6,#60a5fa,#3b82f6);mask:radial-gradient(circle at 62% 50%,transparent 4px,#000 4.5px);-webkit-mask:radial-gradient(circle at 62% 50%,transparent 4px,#000 4.5px)}
.main{position:relative;z-index:1;min-height:0;display:flex;flex-direction:column}

/* bottom bar with colourful placeholder icons */
.bnav{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px;border-top:1px solid var(--border);background:rgba(255,255,255,.012)}
.bnav a{position:relative;display:grid;justify-items:center;gap:4px;padding:6px 12px;border-radius:12px;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer;transition:color .15s}
.bnav .ic{position:relative;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.18),0 4px 12px -4px var(--g2);
  background:radial-gradient(120% 90% at 30% 10%,rgba(255,255,255,.35),transparent 55%),linear-gradient(160deg,var(--g1),var(--g2));
  filter:saturate(.45) brightness(.8);opacity:.7;transition:filter .2s,opacity .2s,transform .2s var(--ease)}
.bnav .ic svg.i{width:16px;height:16px;stroke-width:2.3}
.bnav a:hover .ic{filter:saturate(.8) brightness(.95);opacity:.95;transform:translateY(-1px)}
.bnav a:hover{color:var(--text2)}
.bnav a.on{color:var(--text)}
.bnav a.on .ic{filter:none;opacity:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,0,.18),0 6px 20px -4px var(--g2)}
.bnav a.on::after{content:"";position:absolute;bottom:-3px;width:18px;height:3px;border-radius:3px;background:var(--g1);box-shadow:0 0 10px var(--g1)}
.bnav .bd{position:absolute;top:-5px;right:-7px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#ef4462;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* page scaffolding */
.screen{display:none;flex:1;min-height:0;flex-direction:column;padding:22px 28px 0}
.screen.on{display:flex}
.phead{display:flex;align-items:flex-end;gap:16px;padding-bottom:18px;position:relative}
.phead::before{content:"";position:absolute;left:-28px;right:-28px;top:-22px;bottom:-10px;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:16px 16px;
  mask:linear-gradient(180deg,rgba(0,0,0,.9),transparent 90%);-webkit-mask:linear-gradient(180deg,rgba(0,0,0,.9),transparent 90%)}
.phead h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.phead .sub{color:var(--text2);margin-top:5px}
.phead .sub b{color:var(--text);font-weight:600}
.phead .acts{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.seg{display:flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--border)}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;color:var(--text2);font-weight:500;white-space:nowrap}
.seg button .c{font-size:11px;color:var(--text3)}
.seg button.on{background:rgba(255,255,255,.08);color:var(--text);box-shadow:var(--hi)}
.seg button.on .c{color:var(--accentLight)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-weight:600;font-size:12.5px;white-space:nowrap;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--label);transition:border-color .15s,color .15s,filter .15s}
.btn:hover{border-color:var(--borderHover);color:var(--text)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.sm.icon{width:28px;padding:0}
.btn.primary{background:linear-gradient(180deg,#9a6dfa,#7c4ef0);border-color:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 20px rgba(139,92,246,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{filter:grayscale(.7) brightness(.7);cursor:default;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--label);font-weight:600;font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--borderHover)}
.chip .c{color:var(--text3);font-size:11px;font-weight:700}
.chip.on{background:var(--accentDim);border-color:var(--accentBorder);color:var(--text)}
.chip.on .c{color:var(--accentLight)}
.chip .gd{width:8px;height:8px;border-radius:50%}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.15);flex:none}
.scroll{overflow:auto;min-height:0}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.01em}
.stepper{display:inline-flex;align-items:center;height:30px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.03);overflow:hidden}
.stepper span{padding:0 4px 0 10px;color:var(--text3);font-size:12px}
.stepper button{width:26px;height:100%;color:var(--text3);font-size:15px}
.stepper button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.stepper b{min-width:18px;text-align:center;font-weight:700}
.stepper.sm{height:26px;border-radius:8px}
.stepper.sm span{padding-left:8px;font-size:11.5px}
.stepper.sm button{width:22px}
.select{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.03);font-weight:500;color:var(--label);white-space:nowrap;cursor:pointer}
.select:hover{border-color:var(--borderHover)}
.select svg.i{width:13px;height:13px;color:var(--text3)}
.mode{display:inline-flex;height:30px;padding:2px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.mode button{display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:7px;color:var(--text3);font-weight:500;font-size:12px}
.mode button svg.i{width:14px;height:14px}
.mode button.on{background:var(--accentDim);color:var(--accentLight)}

/* ═══ RENAME ═══ */
.rn{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;flex:1;min-height:0}
@container app (max-width:1400px){.rn{grid-template-columns:minmax(0,1fr) 320px}}
.rnList{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;padding-bottom:24px}
.sess{border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));box-shadow:var(--hi)}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.dateTile{width:42px;height:44px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid var(--border);display:grid;place-content:center;text-align:center;line-height:1}
.dateTile small{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--red)}
.dateTile b{font-size:17px;font-weight:700;margin-top:3px}
.sdate{min-width:150px}
.sdate b{display:block;font-size:14px;font-weight:600}
.sdate span{font-size:12px;color:var(--text3)}
.sh .tot{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--text3)}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;padding:12px}
.ft{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px;border-radius:13px;cursor:pointer;overflow:hidden;
  background:radial-gradient(90% 160% at 100% 0%,var(--gc1) 0%,transparent 55%),linear-gradient(100deg,var(--gc2) 0%,var(--gc3) 40%,rgba(255,255,255,.02) 65%);
  border:1px solid var(--gcb);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.ft:hover{transform:translateY(-2px);box-shadow:var(--tileLift)}
.ft.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px -10px rgba(139,92,246,.55)}
.ft .th{width:64px;height:72px;border-radius:9px;object-fit:cover;display:block;border:1px solid rgba(255,255,255,.08)}
.ft .nm{min-width:0;display:flex;flex-direction:column}
.ft .new{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .ext{color:var(--text3);font-weight:500}
.ft .old{font-size:11.5px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .br{margin-top:auto;display:flex;align-items:center;gap:10px}
.ft .len{font-size:12px;color:var(--text2);white-space:nowrap}
.ft .len span{color:var(--text3)}
.ft .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.ft:hover .acts,.ft.sel .acts{opacity:1}
.ft .acts button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text2)}
.ft .acts button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.ft .acts button.on{background:var(--accentDim);color:var(--accentLight)}
.ft .acts svg.i{width:15px;height:15px}
.cb{position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s}
.ft:hover .cb{opacity:1}
/* split panel */
.splitWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.splitWrap.on{grid-template-rows:1fr}
.splitWrap>div{overflow:hidden;min-height:0}
.split{margin:0 12px 12px;padding:14px;border-radius:13px;border:1px solid var(--accentBorder);background:linear-gradient(180deg,rgba(139,92,246,.07),rgba(139,92,246,.02))}
.split .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.split .top h4{font-size:14px;font-weight:700}
.split .top span{color:var(--text3)}
.split .top .r{margin-left:auto;display:flex;gap:8px}
.sruler{position:relative;height:16px;margin-bottom:6px}
.sruler span{position:absolute;top:0;font-size:10.5px;color:var(--text3);transform:translateX(-50%);white-space:nowrap}
.sfilm{position:relative;display:flex;height:120px;border-radius:10px;overflow:hidden;cursor:crosshair;border:1px solid rgba(255,255,255,.08)}
.sfilm img{flex:1 1 0;width:0;min-width:0;height:100%;object-fit:cover;opacity:.8}
.sfilm .seg-shade{position:absolute;top:0;bottom:0;pointer-events:none}
.sfilm .hov{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9);pointer-events:none;display:none}
.sfilm .hov em{position:absolute;bottom:8px;left:6px;font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.7);white-space:nowrap}
.sfilm:hover .hov{display:block}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--accentLight);box-shadow:0 0 12px rgba(167,139,250,.9);z-index:2}
.mk b{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;border-radius:7px;background:var(--accent);font-size:11px;font-weight:700;white-space:nowrap;cursor:default}
.mk b button{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:12px;line-height:1;background:rgba(0,0,0,.25)}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:12px}
.sg{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.sg .l{display:grid;gap:2px;min-width:0;flex:1}
.sg .l b{font-size:12.5px}
.sg .l span{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shint{margin-top:10px;color:var(--text3);font-size:12px}
.drop{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border:1px dashed rgba(255,255,255,.1);border-radius:12px;color:var(--text3);font-size:12.5px}
/* inspector */
.insp{display:flex;flex-direction:column;min-height:0;margin-bottom:22px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012));box-shadow:var(--hi)}
.insp .scroll{padding:14px;display:grid;gap:14px;align-content:start}
.ihead{display:flex;align-items:center;gap:8px}
.ihead .label{margin-right:auto}
.link{color:var(--accentLight);font-weight:600;font-size:12px;cursor:pointer}
.prev{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);aspect-ratio:8/9;height:min(330px,36vh);margin:0 auto;background:#111;cursor:ew-resize}
.prev img{width:100%;height:100%;object-fit:cover;display:block}
.prev .ts{position:absolute;left:10px;bottom:10px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-size:11.5px;font-weight:700}
.prev .hint{position:absolute;right:10px;bottom:10px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);font-size:11px;color:var(--text2);transition:opacity .2s}
.prev:hover .hint{opacity:0}
.pbar{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.07);cursor:ew-resize}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accentLight))}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px}
.facts dt{color:var(--text3)}
.facts dd{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saveas{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);font-size:12.5px;line-height:1.45;word-break:break-all}
.saveas .p{color:var(--text3)}
.iacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.iacts .btn{justify-content:center;padding:0 6px;font-size:12px;height:32px}
.hist{display:grid;gap:2px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12.5px}
.hrow:hover{background:rgba(255,255,255,.035)}
.hrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .w{color:var(--text3);font-size:11.5px}
.hrow .u{display:none;color:var(--yellow);font-size:11.5px;font-weight:700}
.hrow:hover .w{display:none}
.hrow:hover .u{display:inline}

/* ═══ PROJECTS ═══ */
.filters{display:flex;align-items:center;gap:8px;padding-bottom:16px;flex-wrap:wrap}
.filters .div{width:1px;height:20px;background:var(--border);margin:0 4px}
.filters .sa{margin-left:auto;color:var(--accentLight);font-weight:600;cursor:pointer}
.pw{display:grid;grid-template-columns:500px minmax(0,1fr) 0px;gap:0;flex:1;min-height:0;transition:grid-template-columns .38s var(--ease)}
.pw.open{grid-template-columns:92px minmax(0,1fr) 660px}
@container app (max-width:1400px){.pw{grid-template-columns:400px minmax(0,1fr) 0px}.pw.open{grid-template-columns:92px minmax(0,1fr) 560px}}
.plcol{min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-right:18px;transition:padding .38s var(--ease)}
.pw.open .plcol{padding-right:12px}
.plcol>.scroll{overflow-x:hidden}
.railTop{height:0;overflow:hidden;transition:height .3s var(--ease)}
.pw.open .railTop{height:40px}
.railTop button{width:66px;height:30px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text2);display:grid;place-items:center}
.railTop button:hover{color:var(--text);border-color:var(--borderHover)}
.plist{display:grid;gap:10px;padding:2px 2px 24px}
.pc{position:relative;display:flex;align-items:center;gap:14px;padding:13px;border-radius:14px;overflow:hidden;cursor:pointer;min-width:440px;
  background:radial-gradient(90% 160% at 100% 0%,var(--c1f) 0%,transparent 55%),linear-gradient(100deg,var(--c1a) 0%,var(--c06) 40%,rgba(255,255,255,.02) 65%);
  border:1px solid var(--c3d);transition:transform .18s var(--ease),box-shadow .18s}
.pc:hover{transform:translateY(-1px);box-shadow:var(--tileShadow)}
.pc.sel{border-color:var(--accentBorder);box-shadow:0 0 0 1px var(--accentBorder),0 10px 30px -14px rgba(139,92,246,.6);background:radial-gradient(90% 160% at 100% 0%,var(--c1f) 0%,transparent 55%),linear-gradient(100deg,rgba(139,92,246,.16) 0%,var(--c06) 45%,rgba(255,255,255,.02) 70%)}
.post{position:relative;flex:none;width:60px;height:80px;border-radius:10px;overflow:hidden;display:grid;place-items:center;transition:box-shadow .2s}
.post img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 20%,transparent 40%,rgba(0,0,0,.5))}
.post span{position:relative;z-index:1;font-size:12px;font-weight:800;color:#fff;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.pw.open .pc.sel .post{box-shadow:0 0 0 2px var(--accentLight),0 0 16px rgba(167,139,250,.6)}
.pcb{flex:1;min-width:0;transition:opacity .2s}
.pw.open .pcb{opacity:0}
.pc .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .meta{margin-top:4px;font-size:12px;color:var(--text2)}
.pc .row{margin-top:10px;display:flex;align-items:center;gap:12px}
.orbs{display:flex;flex-wrap:wrap;gap:6px}
.orbs i{width:10px;height:10px;border-radius:50%;flex:none;display:block}
.o-U{background:rgba(255,255,255,.10);box-shadow:inset 0 1px 1px rgba(255,255,255,.07)}
.pc .cnt{margin-left:auto;white-space:nowrap;font-size:11px;color:var(--text2);font-weight:600}
.pc .cnt b{color:var(--text)}
.pc .rk{position:absolute;right:12px;top:12px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.pc .rk svg.i{width:13px;height:13px}
.rbadge{position:absolute;right:4px;top:4px;z-index:3;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:none;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.pw.open .rbadge{display:grid}
/* clips column */
.ccol{min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 2px}
.chead{display:flex;align-items:flex-start;gap:14px;padding:2px 2px 14px}
.chead h2{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .s{margin-top:5px;color:var(--text2);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chead .s b{font-weight:700}
.chead .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.rankchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:var(--accentDim);color:var(--accentLight);font-weight:700;font-size:11.5px}
.rankchip svg.i{width:13px;height:13px}
.render{background:linear-gradient(180deg,#34d399,#10b981);color:#04130d;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px -6px rgba(16,185,129,.7)}
.ctabs{display:flex;gap:6px;padding:0 2px 12px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px;padding:4px 2px 24px;align-content:start}
.tile{min-width:0;padding:6px 6px 8px;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)),var(--surface);border:1px solid var(--border);box-shadow:var(--tileShadow);transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--borderHover);box-shadow:var(--tileLift)}
.tile.ok{border-color:var(--greenBorder)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--tileShadow)}
.tile .st{position:relative;aspect-ratio:8/9;border-radius:10px;overflow:hidden;background:#15161d}
.tile .st img,.tile .st video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile.rej .st{opacity:.4}
.tile .du{position:absolute;right:6px;bottom:6px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);font-size:11px;font-weight:700;z-index:2}
.tile .pb{position:absolute;left:6px;top:6px;z-index:2;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.02em}
.pb.P{background:rgba(34,211,238,.18);color:#67e8f9;border:1px solid rgba(34,211,238,.35)}
.pb.S{background:rgba(251,191,36,.16);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.pb.Q{background:rgba(249,115,22,.16);color:#fdba74;border:1px solid rgba(249,115,22,.3)}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;z-index:1;opacity:0;transition:opacity .2s}
.tile .play span{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center}
.tile:hover .play{opacity:1}
.tile.playing .play{opacity:0}
.tile .tt{font-size:13px;font-weight:700;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.rej .tt{color:var(--text3)}
.tile .sr{display:flex;align-items:center;gap:6px;margin:7px 2px 0}
.score{display:flex;align-items:baseline;gap:2px}
.score b{font-weight:800;line-height:1}
.score span{font-weight:600;color:var(--text3)}
.ar{margin-left:auto;display:flex;gap:6px}
.ar button{width:36px;height:30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--text2)}
.ar button:hover{color:var(--text);border-color:var(--borderHover)}
.ar button.ok.on{background:var(--greenDim);border-color:var(--greenBorder);color:var(--green)}
.ar button.no.on{background:var(--redDim);border-color:rgba(248,113,113,.25);color:var(--red)}
.ar svg.i{width:15px;height:15px;stroke-width:2.4}
.why{font-size:11px;font-weight:700;color:var(--red);margin:6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why span{color:var(--text3);font-weight:600}
/* clip panel */
.cp{min-width:0;min-height:0;overflow:hidden;padding-left:0;transition:padding .38s var(--ease)}
.pw.open .cp{padding-left:18px}
.cpi{width:640px;height:100%;padding-bottom:22px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;opacity:0;transform:translateX(24px);transition:opacity .3s .08s,transform .38s var(--ease)}
@container app (max-width:1400px){.cpi{width:540px;grid-template-columns:240px minmax(0,1fr)}}
.pw.open .cpi{opacity:1;transform:none}
.player{position:relative;align-self:start;aspect-ratio:8/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border);cursor:pointer}
.player img,.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.player .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#111;transition:opacity .2s,transform .2s var(--ease);z-index:2}
.player .big svg.i{width:22px;height:22px;fill:#111;stroke:none;margin-left:3px}
.player.playing .big{opacity:0;transform:translate(-50%,-50%) scale(.85)}
.player .du{position:absolute;right:8px;bottom:12px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.65);font-size:11.5px;font-weight:700;z-index:2}
.player .seek{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.15);z-index:2;transition:height .15s}
.player:hover .seek{height:6px}
.player .seek i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.cdet{min-width:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-right:4px;position:relative}
.cdet .x{position:absolute;right:4px;top:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--text2)}
.cdet .x:hover{color:var(--text)}
.cdet h3{font-size:19px;font-weight:800;line-height:1.25;padding-right:40px}
.cdet .mr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text2)}
.bigscore{display:flex;align-items:baseline;gap:10px}
.bigscore .score b{font-size:38px}
.bigscore .score span{font-size:18px}
.bigscore em{font-style:normal;color:var(--text3)}
.reason{font-size:12.5px;line-height:1.5;color:var(--label);padding:10px 12px;border-radius:10px;background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.16)}
.reason b{color:var(--accentLight);font-weight:700}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dec button{height:40px;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--label)}
.dec .ok:hover,.dec .ok.on{background:var(--greenDim);border-color:var(--greenBorder);color:var(--green)}
.dec .no:hover,.dec .no.on{background:var(--redDim);border-color:rgba(248,113,113,.25);color:var(--red)}
.edit{height:40px;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#9a6dfa,#7c4ef0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 18px -6px rgba(139,92,246,.7)}
.trans{font-size:12.5px;line-height:1.6;color:var(--text2);padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--border)}
.keys{color:var(--text3);font-size:11.5px}
.keys kbd{font-family:inherit;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text2)}
</style>
</head>

<script>
const A = "ui-revamp/";
const svg = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
const GAMES = {Val:["Valorant","#ff4655"],MC:["Meccha Chameleon","#00ff88"],"100T":["100T Valorant Reacts","#ea3323"],"GTA6-R":["GTA6 Reacts","#f042a0"],ROBOT:["Robot Olympics Reacts","#8a9bb8"],RL:["Rocket League","#00b4d8"],DD:["Deadline Delivery","#fca311"],EO:["Egging On","#ffd23f"],AR:["Arc Raiders","#ff6b35"]};
const ART = {MC:"meccha-chameleon.jpg",RL:"rocket-league.jpg",AR:"arc-raiders.jpg",EO:"egging-on.jpg",DD:"deadline-delivery.jpg"};
const REASONS = {"nothing-happens":"Nothing happens","no-payoff":"No payoff","live-only":"Didn't stand alone","needs-context":"Needs context","not-funny":"Not funny","no-reaction":"No real reaction","no-stakes":"No stakes","not-impressive":"Not impressive","chat-banter":"Chat banter","setup-talk":"Setup / tech talk","reaction-adds-nothing":"Reaction added nothing","flat-delivery":"Fell flat","sounds-angry":"Just sounded angry","duplicate":"Duplicate","bad-cut":"Bad cut","repetitive":"Too similar","wrong-content":"Wrong content"};
const DOT = {P:["#a3f2ff","#22e0ff","#0d95b8","rgba(34,224,255,.55)"],S:["#ffe9a3","#ffcf24","#c98a06","rgba(255,207,36,.5)"],Q:["#ffc08a","#ff7d1f","#c24f05","rgba(255,125,31,.55)"],A:["#8fffcd","#0aef86","#059a55","rgba(10,239,134,.55)"],R:["#ffa8b4","#ff4560","#c2203c","rgba(255,69,96,.55)"]};
const orb = (c, ember) => { if (c==="U") return `<i class="o-U"></i>`; const g=DOT[c];
  return `<i style="background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.3) 16%,transparent 42%),radial-gradient(circle at 50% 58%,${g[0]} 0%,${g[1]} 52%,${g[2]} 100%);box-shadow:${ember?"inset 0 -1px 2px rgba(0,0,0,.35)":`0 0 9px ${g[3]},inset 0 -1px 2px rgba(0,0,0,.35)`};${ember?"opacity:.22":""}"></i>`; };
const hexA = (h,a) => { const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const tagEl = t => `<span class="tag" style="background:${hexA(GAMES[t][1],.14)};color:${GAMES[t][1]};border:1px solid ${hexA(GAMES[t][1],.3)}">${t}</span>`;
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const clock = m => { let h=Math.floor(m/60), mm=Math.round(m%60); if(mm===60){h++;mm=0} return `${((h+11)%12)+1}:${String(mm).padStart(2,"0")} ${h>=12?"PM":"AM"}`; };
const hm = secs => { const m=Math.round(secs/60); return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`; };
const scoreEl = (s,size) => { if(!s) return ""; const v=(s/10).toFixed(1), n=+v, col=n>=8?"var(--green)":n>=6?"var(--yellow)":"var(--red)";
  return `<div class="score"><b style="font-size:${size}px;color:${col}">${v}</b><span style="font-size:${Math.round(size*.54)}px">/10</span></div>`; };

const SESS = [
  {mon:"SEP",d:21,dow:"Monday",date:"2026-09-21",tag:"Val",day:8,startMin:13*60+24+52/60,
   files:[{orig:"2026-09-21 13-24-52.mp4",pt:1,secs:1804,size:"1.30 GB",k:1,marks:[]},{orig:"2026-09-21 13-54-56.mp4",pt:2,secs:957,size:"683 MB",k:2,marks:[]}]},
  {mon:"OCT",d:1,dow:"Thursday",date:"2026-10-01",tag:"Val",day:9,startMin:13*60+2+7/60,
   files:[{orig:"2026-10-01 13-02-07.mp4",pt:1,secs:1804,size:"1.24 GB",k:3,marks:[]},{orig:"2026-10-01 13-32-12.mp4",pt:2,secs:1800,size:"596 MB",k:4,marks:[]}]}
];
const NF = 40;
// Preload every scrub frame once, so scrubbing only swaps cached pictures.
const FRAMES = {}; [1,2,3,4].forEach(k => FRAMES[k] = Array.from({length:NF},(_,i)=>{ const im=new Image(); im.src=`${A}f/${k}-${i+1}.jpg`; return im.src; }));
let sel = [0,0], splitOpen = null;
const sessTotal = s => s.files.reduce((a,f)=>a+f.secs,0);
const newName = (s,f,suffix="") => `${s.date} <span style="color:${GAMES[s.tag][1]}">${s.tag}</span> Day${s.day} Pt${f.pt}${suffix}<span class="ext">.mp4</span>`;
const gameVars = t => { const c=GAMES[t][1]; return `--gc1:${hexA(c,.12)};--gc2:${hexA(c,.10)};--gc3:${hexA(c,.025)};--gcb:${hexA(c,.24)}`; };

function renderRename(){
  document.getElementById("rnList").innerHTML = SESS.map((s,i)=>`
    <div class="sess">
      <div class="sh">
        <div class="dateTile"><small>${s.mon}</small><b>${s.d}</b></div>
        <div class="sdate"><b>${s.dow}</b><span class="num">${clock(s.startMin)} to ${clock(s.startMin+sessTotal(s)/60)} · ${hm(sessTotal(s))}</span></div>
        <div class="select">${tagEl(s.tag)}${GAMES[s.tag][0]}${svg("down")}</div>
        <div class="mode"><button class="on">${svg("pad")}Playing</button><button>${svg("mic")}Reacting</button></div>
        <div class="stepper"><span>Day</span><button data-day="${i}" data-dd="-1">−</button><b>${s.day}</b><button data-day="${i}" data-dd="1">+</button></div>
        <div class="select">Date · Tag · Day · Part${svg("down")}</div>
        <div class="tot"><span class="num">${s.files.length} parts</span><button class="btn sm icon" title="Show session in Explorer">${svg("folder")}</button></div>
      </div>
      <div class="ftiles">${s.files.map((f,j)=>`
        <div class="ft ${sel[0]===i&&sel[1]===j?"sel":""}" style="${gameVars(s.tag)}" data-f="${i},${j}">
          <span class="cb"></span>
          <img class="th" src="${FRAMES[f.k][12]}">
          <div class="nm">
            <div class="new">${newName(s,f)}</div>
            <div class="old">from ${f.orig}</div>
            <div class="br">
              <div class="stepper sm"><span>Pt</span><button>−</button><b>${f.pt}</b><button>+</button></div>
              <span class="len num">${fmt(f.secs)}</span>
              <div class="acts">
                <button class="${splitOpen&&splitOpen[0]===i&&splitOpen[1]===j?"on":""}" data-split="${i},${j}" title="Mark where the game changes">${svg("scissors")}</button>
                <button title="Show in Explorer">${svg("folder")}</button>
                <button title="Hide from pending">${svg("eyeoff")}</button>
              </div>
            </div>
          </div>
        </div>`).join("")}
      </div>
      <div class="splitWrap ${splitOpen&&splitOpen[0]===i?"on":""}"><div>${splitOpen&&splitOpen[0]===i?splitHtml(s,s.files[splitOpen[1]]):""}</div></div>
    </div>`).join("") + `<div class="drop">${svg("plus")}Drop an .mp4 or .mkv anywhere on this page to add it</div>`;
  wireSplit();
}
function splitHtml(s,f){
  const ticks=[]; for(let t=0;t<=f.secs;t+=300) ticks.push(`<span style="left:${t/f.secs*100}%">${fmt(t)}</span>`);
  const pts=[0,...f.marks,f.secs], letters="abcdefgh";
  const shades = pts.slice(0,-1).map((a,i)=>`<div class="seg-shade" style="left:${a/f.secs*100}%;width:${(pts[i+1]-a)/f.secs*100}%;background:${i%2?"rgba(139,92,246,.10)":"transparent"}"></div>`).join("");
  return `<div class="split">
    <div class="top">${svg("scissors")}<h4>Mark where the game changes</h4><span class="num">in Pt${f.pt} · ${fmt(f.secs)}</span>
      <div class="r"><button class="btn sm" data-close>Cancel</button><button class="btn sm primary" ${f.marks.length?"":"disabled"}>Split into ${f.marks.length+1} parts</button></div></div>
    <div class="sruler num">${ticks.join("")}</div>
    <div class="sfilm" id="sfilm" data-secs="${f.secs}" data-k="${f.k}">
      ${FRAMES[f.k].filter((_,i)=>i%2).map(src=>`<img src="${src}">`).join("")}
      ${shades}
      ${f.marks.map((m,mi)=>`<div class="mk" style="left:${m/f.secs*100}%"><b class="num">${fmt(m)}<button data-unmark="${mi}">×</button></b></div>`).join("")}
      <div class="hov"><em class="num">0:00</em></div>
    </div>
    ${f.marks.length ? `<div class="segs">${pts.slice(0,-1).map((a,i)=>`
      <div class="sg"><div class="l"><b class="num">Part ${letters[i]} · ${fmt(a)} to ${fmt(pts[i+1])}</b><span>${s.date} ${s.tag} Day${s.day} Pt${f.pt}${letters[i]}.mp4</span></div>
      <div class="select">${tagEl(s.tag)}${svg("down")}</div></div>`).join("")}</div>`
      : `<div class="shint">Click the strip where a new game starts. Each marker splits the recording into its own part, and you can pick the game for each one.</div>`}
  </div>`;
}
function wireSplit(){
  const film = document.getElementById("sfilm"); if(!film) return;
  const secs=+film.dataset.secs, k=+film.dataset.k, hov=film.querySelector(".hov"), em=hov.querySelector("em");
  film.addEventListener("mousemove", e => { const r=film.getBoundingClientRect(), x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    hov.style.left=(x*100)+"%"; em.textContent=fmt(secs*x); showFrame(k, x, secs); });
  film.addEventListener("click", e => { if(e.target.closest("[data-unmark]")) return; const r=film.getBoundingClientRect(), x=(e.clientX-r.left)/r.width;
    const f=SESS[splitOpen[0]].files[splitOpen[1]]; f.marks.push(Math.round(secs*x)); f.marks.sort((a,b)=>a-b); renderRename(); });
}
document.getElementById("rnList").addEventListener("click", e => {
  const d=e.target.closest("[data-day]"); if(d){ SESS[+d.dataset.day].day += +d.dataset.dd; renderRename(); renderInsp(); return; }
  const un=e.target.closest("[data-unmark]"); if(un){ SESS[splitOpen[0]].files[splitOpen[1]].marks.splice(+un.dataset.unmark,1); renderRename(); return; }
  if(e.target.closest("[data-close]")){ closeSplit(); return; }
  const sp=e.target.closest("[data-split]"); if(sp){ const v=sp.dataset.split.split(",").map(Number); sel=v;
    if(splitOpen && splitOpen+""===v+""){ closeSplit(); return; }
    const wasOther = splitOpen && splitOpen[0]===v[0]; splitOpen=v;
    if(wasOther){ renderRename(); } else { renderRename(); const w=document.querySelectorAll(".splitWrap")[v[0]]; w.classList.remove("on"); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add("on"))); }
    renderInsp(); return; }
  const t=e.target.closest(".ft"); if(t && !e.target.closest(".stepper")){ sel=t.dataset.f.split(",").map(Number); renderRename(); renderInsp(); }
});
function closeSplit(){ const i=splitOpen[0]; const w=document.querySelectorAll(".splitWrap")[i]; w.classList.remove("on"); setTimeout(()=>{ splitOpen=null; renderRename(); },330); }

let raf=0, pending=null;
function showFrame(k,x,secs){ pending=[k,x,secs]; if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; const [k2,x2,s2]=pending;
  const img=document.getElementById("pimg"); if(!img) return; img.src=FRAMES[k2][Math.min(NF-1,Math.floor(x2*NF))];
  document.getElementById("pts").textContent=`${fmt(s2*x2)} / ${fmt(s2)}`; document.getElementById("pfill").style.width=(x2*100)+"%"; }); }
function renderInsp(){
  const s=SESS[sel[0]], f=s.files[sel[1]];
  const hist=[["100T","2026-09-30 100T Day6 Pt4","2 days ago"],["100T","2026-09-30 100T Day6 Pt3","2 days ago"],["100T","2026-09-30 100T Day6 Pt2","2 days ago"],["100T","2026-09-30 100T Day6 Pt1","2 days ago"],["100T","2026-09-29 100T Day5 Pt4","3 days ago"],["100T","2026-09-29 100T Day5 Pt3","3 days ago"]];
  const mon=s.mon[0]+s.mon.slice(1).toLowerCase();
  document.getElementById("insp").innerHTML = `
    <div class="ihead"><span class="label">Pt${f.pt} · ${s.dow.slice(0,3)} ${mon} ${s.d}</span></div>
    <div class="prev" id="prev"><img id="pimg" src="${FRAMES[f.k][0]}"><span class="ts num" id="pts">0:00 / ${fmt(f.secs)}</span><span class="hint">Move across to scrub</span></div>
    <div class="pbar" id="pbar"><i id="pfill" style="width:0%"></i></div>
    <dl class="facts num">
      <dt>Recorded</dt><dd>${s.dow.slice(0,3)}, ${mon} ${s.d} · ${clock(s.startMin + s.files.slice(0,sel[1]).reduce((a,x)=>a+x.secs,0)/60)}</dd>
      <dt>Length</dt><dd>${fmt(f.secs)}</dd><dt>Size</dt><dd>${f.size}</dd>
      <dt>Video</dt><dd>2560 × 2880 · 60 fps · HEVC</dd><dt>Audio</dt><dd>5 tracks</dd>
    </dl>
    <div class="saveas"><span class="p">Saves as</span><br>Recordings\\${s.date.slice(0,7)}\\<b>${s.date} ${s.tag} Day${s.day} Pt${f.pt}.mp4</b></div>
    <div class="iacts"><button class="btn" data-isplit>${svg("scissors")}Split</button><button class="btn">${svg("folder")}Explorer</button><button class="btn">${svg("eyeoff")}Hide</button></div>
    <div><div class="ihead" style="margin-bottom:6px"><span class="label">Recently renamed</span><span class="link">All history</span></div>
      <div class="hist">${hist.map(h=>`<div class="hrow">${tagEl(h[0])}<span class="n">${h[1]}</span><span class="w">${h[2]}</span><span class="u">Undo</span></div>`).join("")}</div></div>`;
  [document.getElementById("prev"),document.getElementById("pbar")].forEach(el=>el.addEventListener("mousemove",e=>{ const r=el.getBoundingClientRect(); showFrame(f.k,Math.min(.9999,Math.max(0,(e.clientX-r.left)/r.width)),f.secs); }));
  document.querySelector("[data-isplit]").onclick=()=>document.querySelector(`[data-split="${sel[0]},${sel[1]}"]`).click();
}

function clipsOf(i){
  const [name,tag,d,ranked]=PROJ[i], det=DATA[name];
  let clips = [...d].map((st,ci)=>{ const c=det?.clips[ci]||{}; return {ci, st:c.st||st, img:c.img?A+c.img:null, t:c.t||`Clip ${ci+1}`, dur:c.dur||30,
    score: ranked ? c.j?.[0] : (c.hs||0), why: c.j?.[1], rr:c.rr, txt:c.txt, e:c.e, start:c.start, end:c.end,
    vid: VIDS.has(`${Object.keys(DATA).indexOf(name)}-${ci}`) ? `${A}v/${Object.keys(DATA).indexOf(name)}-${ci}.mp4` : null}; });
  if (ranked) clips.sort((a,b)=>(b.score||0)-(a.score||0));
  return clips;
}
function setCols(){
  const g=document.getElementById("grid"); if(!g) return;
  // Column count for the layout we're heading to, so tiles resize smoothly during the slide instead of jumping.
  const app=document.getElementById("app").getBoundingClientRect().width, small=app<=1400;
  const L = open ? 92 : (small?400:500), P = open ? (small?578:678) : 0;
  const w = app - 56 - L - P - 4, min = 150;
  g.style.setProperty("--cols", Math.max(2, Math.floor((w+12)/(min+12))));
}

  stopHover(); const v=document.createElement("video"); v.src=t.dataset.v; v.muted=true; v.playsInline=true; v.loop=true; v.autoplay=true; t.querySelector(".st").appendChild(v); t.classList.add("playing"); hovVid=[t,v]; });
document.getElementById("ccol").addEventListener("mouseout", e => { const t=e.target.closest(".tile[data-v]"); if(t && !t.contains(e.relatedTarget)) stopHover(); });
function stopHover(){ if(!hovVid) return; const [t,v]=hovVid; v.pause(); v.removeAttribute("src"); v.load(); v.remove(); t.classList.remove("playing"); hovVid=null; }
document.addEventListener("keydown", e => {
  if(!document.getElementById("pr").classList.contains("on")) return;
  if(e.key==="Escape" && open) closePanel();
  if(open && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ const cl=clipsOf(selP), i=cl.findIndex(c=>c.ci===selC), n=cl[i+(e.key==="ArrowRight"?1:-1)]; if(n){ openPanel(n.ci); document.querySelector(`.tile[data-c="${n.ci}"]`)?.scrollIntoView({block:"nearest",behavior:"smooth"}); } }
});
window.addEventListener("resize", setCols);

/* ── notes + harness ───────────────────────────────────────────────────── */
const NOTES = {
  rn:["Rename v2",["Files sit side by side as tiles, like the Recordings tab. On a wide screen a session's parts fit on one row.","Each tile carries the game's colour, like the project cards.","Split (scissors on the tile, or in the right panel) opens a long filmstrip under that session. Click where a new game starts to drop a marker, × to remove it. Each piece gets its own game and name. Hovering the strip also scrubs the big preview.","Preview scrubbing swaps 40 pre-made frames, so it's instant. The real app would make about 100 per recording when it lands, without opening the video file (which is what blocked renames before).","TOTAL / GAMES counters dropped. Undo shows when you hover a recent rename."]],
  pr:["Projects v2",["Your current project cards are back: game-colour gradients, posters, glossy orbs.","Click a project: its clips show on the right straight away, same tiles as today (score, ✓ ✕, Why line on rejected clips). Published, scheduled and queued clips get a small badge on the picture.","Hover a clip to play it muted. In this mockup the first 8 of 100T Day5 Pt1 and the kept MC Day3 Pt1 clips play.","Click a clip: the project list slides into a poster rail, and the player plus details open on the right. Click it to play with sound. ← → steps clips, Esc slides the list back.","In the rail, click another poster to jump projects without going back. The number on a poster is how many clips are left to review.","Ranked projects (100T Day5 Pt1) are sorted best first, with Corva's reason in the panel."]]
};
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("#scrSeg button").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  document.querySelectorAll("#bnav a").forEach(a=>a.classList.toggle("on",a.dataset.t===(id==="rn"?"Rename":"Projects")));
  const [h,items]=NOTES[id]; document.getElementById("notes").innerHTML=`<h4>${h}</h4><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  setCols();
}
document.getElementById("scrSeg").onclick = e => { const b=e.target.closest("button"); if(b) show(b.dataset.s); };
document.getElementById("winSeg").onclick = e => { const b=e.target.closest("button"); if(!b) return; document.getElementById("app").classList.toggle("small",b.dataset.w==="small"); [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); setCols(); };
document.getElementById("notesBtn").onclick = () => document.getElementById("notes").classList.toggle("on");
document.getElementById("bnav").onclick = e => { const a=e.target.closest("a"); if(a&&(a.dataset.t==="Rename"||a.dataset.t==="Projects")) show(a.dataset.t==="Rename"?"rn":"pr"); };
document.getElementById("filters").innerHTML = filtersHtml();
renderRename(); renderInsp(); renderList(); renderClips(); show("rn");
</script>
