<!DOCTYPE html>
<!-- #328: data-theme ships on the tag so the markup is never attribute-less.
     The preload overwrites it with the saved theme at document-start, before
     the first stylesheet applies — the CSP has no 'unsafe-inline' for scripts,
     so a boot script here is not an option. -->
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b10" />
    <!-- Kept as the Midnight value; App.js rewrites it whenever the theme changes. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: file: https://*.googleusercontent.com https://yt3.ggpht.com https://*.tiktokcdn.com https://*.tiktokcdn-us.com https://*.fbcdn.net https://*.cdninstagram.com https://platform-lookaside.fbsbx.com; media-src 'self' blob: file:; connect-src 'self' file: https://us.i.posthog.com https://us-assets.i.posthog.com https://*.ingest.us.sentry.io; object-src 'none'; base-uri 'self'; form-action 'none';" />
    <link rel="icon" href="./icon.png" />
    <title>Corva</title>
    <style>
      /* Fonts loaded locally from assets in production, CDN fallback for dev */
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Both painted from tokens. Until themes.css lands these resolve to
         nothing and the window's own backgroundColor (set per-theme in
         main.js) shows through — which is the correct colour already. */
      html {
        background: var(--bg);
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', -apple-system, sans-serif;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }

      /* Custom scrollbar — thin, contained within UI boundaries */
      *::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
        margin: 4px 0;
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(var(--lift), 0.14);
        border-radius: 3px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(var(--lift), 0.26);
      }
      *::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* PulseDot animation */
      @keyframes pulse {
        0%, 100% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 0.4; transform: scale(1.4); }
      }

      /* Scrollbar (Firefox) */
      * { scrollbar-width: thin; scrollbar-color: rgba(var(--lift),0.14) transparent; }

      /* Disable text selection on UI elements */
      button, [role="button"] {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Title bar drag region */
      .titlebar-drag {
        -webkit-app-region: drag;
      }
      .titlebar-drag button,
      .titlebar-drag input,
      .titlebar-drag select {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
